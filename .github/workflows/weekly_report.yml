name: Salı Günü Haftalık Spor Raporu
on:
  schedule:
    # Her Salı sabahı Türkiye saatiyle 10:00 (TSİ = UTC+3 olduğundan UTC 07:00)
    - cron: '0 7 * * 2'
  workflow_dispatch:
jobs:
  send-weekly-sports-report:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu İndir (Checkout)
        uses: actions/checkout@v4
      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Gerekli Paketleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Raporu Oluştur ve E-postayı Gönder
        env:
          APP_URL: 'https://segkolik.streamlit.app'
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: 'true'
          REPORT_DAYS: '7'
          TIMEZONE: 'Europe/Istanbul'
          SEND_EMPTY_REPORT: 'true'
          TEST_MODE: 'false'
        run: |
          python main.py --now --no-delay --bypass-duplicate --days 7
